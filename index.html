var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

                  || (r == 0 && c == 0) ) {

              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;

        var mod = (!test && ( (bits >> i) & 1) == 1);

        } else {

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

function simular(pid,x){const p=pres(pid);const r=periodRate(p);const cuotasPend=p.cuotas.filter(q=>q.pagado<q.valor).length;const A=saldoPrest(p);const K=saldoCap(p);
 if(!x||x<=0)return`<div class="alert info">Escribe un valor para ver el resultado.</div>`;
 if(p.metodo==="S")return`<div class="alert warn">Este préstamo tiene <b>interés fijo</b> acordado: un abono extra reduce tu saldo, pero no baja los intereses. Puedes hablar con el prestamista para acordar un descuento por pago anticipado.</div>`;
 if(x>=A)return`<div class="alert ok">Con ${money(x)} <b>terminas de pagar</b> hoy tu préstamo (debes ${money(A)}).</div>`;
 const K2=Math.max(0,K-x);const nc=r===0?K2/cuotasPend:K2*r/(1-Math.pow(1+r,-cuotasPend));const B=x+nc*cuotasPend;const ah=A-B;
 return `<div class="grid kpis"><div class="card kpi"><small>Sin abono pagarías</small><b>${money(A)}</b></div><div class="card kpi"><small>Con abono pagarías</small><b>${money(B)}</b></div><div class="card kpi ok"><small>Te ahorras</small><b>${money(Math.max(0,ah))}</b></div></div><div class="alert info" style="margin-top:8px">Tu cuota bajaría a aproximadamente <b>${money(nc)}</b> (${cuotasPend} cuotas restantes).</div>`}

function leerArchivo(f){return new Promise((res,rej)=>{
 if(f.type.startsWith("image/")){const r=new FileReader();r.onerror=()=>rej("No se pudo leer el archivo.");r.onload=()=>{const im=new Image();im.onerror=()=>rej("No se pudo leer la imagen.");im.onload=()=>{let k=Math.min(1,(CLOUD?800:900)/Math.max(im.width,im.height)),q=CLOUD?.6:.7,d;const cv=document.createElement("canvas");for(let n=0;n<5;n++){cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);d=cv.toDataURL("image/jpeg",q);if(!CLOUD||d.length<=280000)break;k*=.8;q=Math.max(.4,q-.08)}res({nombre:f.name.replace(/\.\w+$/,"")+".jpg",mime:"image/jpeg",data:d})};im.src=r.result};r.readAsDataURL(f)}
 else if(f.type==="application/pdf"){if(f.size>(CLOUD?200:700)*1024){rej(`El PDF pesa mucho (máx. ${CLOUD?200:700} KB). Mejor envía una foto.`);return}const r=new FileReader();r.onerror=()=>rej("No se pudo leer el PDF.");r.onload=()=>res({nombre:f.name,mime:f.type,data:r.result});r.readAsDataURL(f)}
 else rej("Solo se aceptan fotos o PDF.")})}

/* ---- calculadora de interés simple del cliente ---- */
function calcSimple(monto,plazo,unidad){const cu=buildCuotas(monto,db.cfg.tasaSimple,unidad,plazo,today(),"S");const tot=cu.reduce((a,q)=>a+q.valor,0);return{cu,tot,int:tot-monto}}
const plazoMaxU=()=>ui.calc.unidad==="M"?db.cfg.plazoMax:db.cfg.plazoMax*2;
function calcRes(){const k=db.cfg,s=ui.calc;
 if(!(s.monto>=k.montoMin&&s.monto<=k.montoMax))return`<div class="alert warn" style="margin-top:10px">Escribe un valor entre ${money(k.montoMin)} y ${money(k.montoMax)}.</div>`;
 const {cu,tot,int}=calcSimple(s.monto,s.plazo,s.unidad);const dias=s.unidad==="M"?s.plazo+(s.plazo===1?" mes":" meses"):s.plazo+(s.plazo===1?" quincena":" quincenas")+" ("+s.plazo*15+" días)";
 return `<div class="hero"><small>Pagarías ${s.plazo} cuota${s.plazo>1?"s":""} ${s.unidad==="M"?"mensuales":"quincenales"} de aprox.</small><div class="bigc">${money(cu[0].valor)}</div><div class="hrow"><div><small>Total a pagar</small><b>${money(tot)}</b></div><div><small>Intereses</small><b>${money(int)}</b></div><div><small>Plazo</small><b>${dias}</b></div></div></div>
 <div class="card" style="margin-top:10px"><h3 style="margin-bottom:6px">Tus fechas de pago</h3><div class="scroll"><table class="t"><thead><tr><th>Cuota</th><th>Fecha</th><th>Valor</th></tr></thead><tbody>${cu.map(q=>`<tr><td>${q.n}</td><td>${fd(q.fecha)}</td><td>${money(q.valor)}</td></tr>`).join("")}</tbody></table></div></div>
 <button class="btn" id="csol" style="width:100%;margin-top:10px;padding:12px">📨 Solicitar este préstamo</button>
 <p class="alert info" style="margin-top:10px">Es un cálculo informativo. El prestamista confirma el valor final cuando revise tu solicitud.</p>`}
function vCCalc(){const k=db.cfg,s=ui.calc;
 return `<h1>Calcula tu préstamo</h1><p style="color:var(--mut);margin:-4px 0 10px">Interés simple de ${String(k.tasaSimple).replace(".",",")}% mensual sobre lo que pides. Elige cuánto y en cuánto tiempo.</p>
 <div class="card"><label class="f">¿Cuánto necesitas?<div class="moneyin"><span>$</span><input id="cm" inputmode="numeric" value="${s.monto.toLocaleString("es-CO")}" aria-label="Valor del préstamo"></div></label>
 <input type="range" id="cr" min="${k.montoMin}" max="${k.montoMax}" step="50000" value="${s.monto}" aria-label="Valor del préstamo">
 <div class="row"><small style="color:var(--mut)">${money(k.montoMin)}</small><span class="sp"></span><small style="color:var(--mut)">${money(k.montoMax)}</small></div>
 <div class="f" style="margin:12px 0 6px">¿En cuánto tiempo lo pagas?</div>
 <div class="row"><div class="stepper"><button data-pl="-1" aria-label="Menos tiempo">−</button><b id="cpv">${s.plazo}</b><button data-pl="1" aria-label="Más tiempo">+</button></div><div class="seg2" role="group" aria-label="Unidad"><button data-un="M" aria-pressed="${s.unidad==="M"}">Meses</button><button data-un="Q" aria-pressed="${s.unidad==="Q"}">Quincenas</button></div></div></div>
 <div id="cres">${calcRes()}</div>${abonoHtml()}`}

});

/* ---- enviar cambios al servidor (solo lo que cambió) ---- */
async function syncNow(){
 if(!CLOUD||!sync.ok)return;if(sync.busy){sync.again=true;return}sync.busy=true;
 try{const {doc,setDoc}=FS;const jobs=[];
  for(const col of COLS_W[sync.role]){const base=sync.base[col]||(sync.base[col]={});
   for(const it of db[col]){if(!it.id)continue;const f=fpDoc(it);const b=base[it.id];
    if(!b){if(sync.role==="cliente"&&col==="clientes"&&it.id!==sync.uid)continue;base[it.id]=f;jobs.push([col,it.id,cl(it),false])}
    else{const ch=Object.keys(f).filter(k=>f[k]!==b[k]);if(ch.length){const pay={};ch.forEach(k=>pay[k]=cl(it[k]));base[it.id]=f;jobs.push([col,it.id,pay,true])}}}}
  if(sync.role==="prestamista"){const f=fpk(db.cfg);if(f!==sync.cfgFp){sync.cfgFp=f;jobs.push(["__cfg",sync.pid,{cfg:cl(db.cfg)},true])}}
  await Promise.all(jobs.map(([col,id,pay,merge])=>{const ref=col==="__cfg"?doc(fdb,"prestamistas",sync.pid):doc(fdb,"prestamistas",sync.pid,col,id);
   return setDoc(ref,pay,{merge}).catch(e=>{console.error("Error guardando",col,id,e);toast("No se pudo guardar: "+(e.code||e.message))})}));
 }finally{sync.busy=false;if(sync.again){sync.again=false;syncNow()}}}
function flushSync(){clearTimeout(sync.timer);syncNow()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&CLOUD)flushSync()});
window.addEventListener("pagehide",()=>{if(CLOUD)flushSync()});
/* ---- sesión ---- */
function salirLocal(){stopSync();CLOUD=false;sync.uid=null;sync.pid=null;sync.role=null;sync.email=""}
async function entrar(u,info){
 try{if(!info){const s=await FS.getDoc(FS.doc(fdb,"usuarios",u.uid));if(!s.exists()){await FA.signOut(fauth);ui.vista="inicio";ui.aviso="Tu cuenta no tiene perfil. Crea la cuenta desde el inicio (si el correo ya existe, usa otro).";draw();return}info=s.data()}
  stopSync();sync.uid=u.uid;sync.email=u.email||"";sync.role=info.rol;sync.pid=info.pid;CLOUD=true;db=emptyDb();
  ui.mode=info.rol==="prestamista"?"P":"C";ui.cid=info.rol==="cliente"?u.uid:null;ui.tab=ui.mode==="P"?"resumen":"c_res";ui.chat=null;ui.nuevo=false;ui.pend=[];ui.draft="";ui.vista="app";ui.aviso="";
  startListeners();draw()}
 catch(e){console.error(e);salirLocal();ui.vista="inicio";ui.aviso="No se pudo abrir tu cuenta: "+(e.code||e.message);draw()}}
function iniciarDemo(){ui.demo=true;CLOUD=false;load();ui.cid=db.clientes[0]&&db.clientes[0].id;ui.mode="P";ui.tab="resumen";ui.vista="app";ui.nuevo=false;draw()}
function msgErr(e){const c=(e&&e.code)||"";return({"auth/email-already-in-use":"Ese correo ya tiene cuenta. Usa «Entrar».","auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Correo o contraseña incorrectos.","auth/user-not-found":"Correo o contraseña incorrectos.","auth/weak-password":"La contraseña debe tener mínimo 6 caracteres.","auth/invalid-email":"Revisa el correo.","auth/network-request-failed":"Sin internet. Revisa tu conexión.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos.","permission-denied":"Falta publicar las reglas de seguridad en Firebase."})[c]||("No se pudo completar: "+(c||(e&&e.message)||e))}
/* ---- pantallas de inicio y acceso ---- */
const vSplash=()=>`<div class="card empty" style="margin-top:40px"><div class="logo" style="margin:0 auto 10px">$</div>Cargando…</div>`;
function vInicio(){return `<div style="text-align:center;margin:18px 0 14px"><div class="logo" style="margin:0 auto 8px;width:56px;height:56px;font-size:1.6rem">$</div><h1 style="margin:0">${esc(BRAND.nombre)}</h1><p style="color:var(--mut);margin:4px 0 0">Préstamos claros, pagos al día.</p></div>
 ${ui.fbError?`<div class="alert warn" style="margin-bottom:10px">No se pudo conectar con el servidor. Revisa tu internet o prueba la demostración.</div>`:""}${ui.aviso?`<div class="alert bad" style="margin-bottom:10px">${esc(ui.aviso)}</div>`:""}
 <div class="list">${ui.pid&&!ui.fbError?`<div class="card"><small style="color:var(--mut)">Te invitó</small><h2 style="margin:0">${esc(ui.pubName||"Tu prestamista")}</h2><button class="btn" data-vista="cli" style="width:100%;margin-top:8px;padding:12px">👤 Soy cliente: entrar o registrarme</button></div>`:`<div class="card empty">¿Eres cliente? Pídele a tu prestamista el enlace de la app.</div>`}
 ${ui.fbError?"":`<button class="btn ${ui.pid?"gh":""}" data-vista="pres" style="padding:12px">🏦 Soy prestamista</button>`}<button class="btn gh" data-demo style="padding:12px">🧪 Probar la demostración</button></div>`}
function vAuth(){const pres=ui.vista==="pres",crear=ui.modo==="crear";const volver=`<button class="btn gh sm" data-vista="inicio">← Volver</button>`;
 if(!pres&&crear)return volver+vNuevo(true);
 return `${volver}<h1 style="margin-top:10px">${pres?"Prestamista":"Cliente"}: ${crear?"crear cuenta":"entrar"}</h1>${!pres?`<p style="color:var(--mut);margin:-4px 0 8px">Con ${esc(ui.pubName||"tu prestamista")}</p>`:""}
 <form id="fauth" class="card form" data-rol="${pres?"pres":"cli"}">${pres&&crear?`<label class="f" style="grid-column:1/-1">Nombre de tu negocio<input name="negocio" required></label>`:""}
 <label class="f" style="grid-column:1/-1">Correo<input type="email" name="email" required autocomplete="email"></label>
 <label class="f" style="grid-column:1/-1">Contraseña<input type="password" name="pass" required minlength="6" autocomplete="${crear?"new-password":"current-password"}"></label>
 <div id="aerr" style="grid-column:1/-1;color:var(--bad);font-weight:700">${ui.aviso?esc(ui.aviso):""}</div>
 <div style="grid-column:1/-1"><button class="btn" type="submit" style="width:100%;padding:12px">${crear?"Crear cuenta":"Entrar"}</button></div>
 <div class="row" style="grid-column:1/-1"><button type="button" class="btn gh sm" data-modo="${crear?"entrar":"crear"}">${crear?"Ya tengo cuenta":"Crear cuenta"}</button>${!crear?`<button type="button" class="btn gh sm" data-reset>Olvidé mi contraseña</button>`:""}</div></form>`}
function renderAuth(){hdrCloud();$("#tabs").style.display="none";$("#calcBtn").style.display="none";$("#calc").classList.remove("on");
 const V={splash:vSplash,inicio:vInicio,pres:vAuth,cli:vAuth};$("#app").innerHTML=(V[ui.vista]||vInicio)()+`<div class="foot">PAMAVA soluciones</div>`}
function hdrCloud(){const app=ui.vista==="app";document.querySelector(".seg").style.display=(app&&!CLOUD)?"":"none";if(!(app&&!CLOUD&&ui.mode==="C"))$("#who").style.display="none";
 $("#ubox").innerHTML=app?(CLOUD?`<small style="opacity:.85;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sync.email)}</small><button class="who" id="salir">Salir</button>`:`<button class="who" data-home>← Inicio</button>`):""}
function cuentaHtml(){const link=location.origin+location.pathname+"?p="+sync.pid;const m=`Hola, le comparto la aplicación de ${db.cfg.prestamista}. Desde ahí puede pedir su préstamo, ver su plan de cuotas, enviar sus documentos y comprobantes de pago y ver el estado de su crédito: ${link}`;
 return `<div class="card" style="margin-top:10px"><h2>Tu enlace para clientes</h2><p style="color:var(--mut);margin:0 0 8px;font-size:.88rem">Envía este enlace por WhatsApp o muestra el código QR. Con él, tus clientes se registran contigo.</p>
 <div class="code" style="display:block;word-break:break-all;font-size:.8rem;letter-spacing:0">${esc(link)}</div><div style="width:170px;margin:10px auto">${qrSvg(link)}</div>
 <div class="row"><button class="btn sec sm" id="copylink" data-link="${esc(link)}">📋 Copiar enlace</button><a class="btn sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(m)}">💬 Enviar por WhatsApp</a></div></div>
 <div class="card" style="margin-top:10px"><h2>Mi cuenta</h2><p style="margin:0 0 8px">${esc(sync.email)}</p><button class="btn gh" id="salir2">Cerrar sesión</button></div>`}
document.addEventListener("click",async e=>{const t=e.target;let b;
 if(b=t.closest("[data-vista]")){ui.vista=b.dataset.vista;ui.modo="entrar";ui.aviso="";draw();return}
 if(b=t.closest("[data-modo]")){ui.modo=b.dataset.modo;ui.aviso="";draw();return}
 if(t.closest("[data-demo]")){iniciarDemo();return}
 if(t.closest("[data-home]")){ui.demo=false;ui.vista="inicio";draw();return}
 if(t.id==="salir"||t.id==="salir2"){if(CLOUD){await FA.signOut(fauth)}return}
 if(b=t.closest("[data-reset]")){const f=$("#fauth");const em=f&&f.email.value.trim();if(!em){$("#aerr").textContent="Escribe tu correo arriba y vuelve a pulsar.";return}
  try{await FA.sendPasswordResetEmail(fauth,em);$("#aerr").style.color="var(--ok)";$("#aerr").textContent="Te enviamos un correo para cambiar la contraseña."}catch(x){$("#aerr").textContent=msgErr(x)}return}
 if(t.id==="copylink"){try{await navigator.clipboard.writeText(t.dataset.link);toast("Enlace copiado")}catch(x){toast("Copia el enlace manualmente")}return}
});
document.addEventListener("submit",async e=>{const f=e.target;
 if(f.id==="fauth"){const err=m=>{$("#aerr").style.color="var(--bad)";$("#aerr").textContent=m};const pres=f.dataset.rol==="pres",crear=ui.modo==="crear";const email=f.email.value.trim(),pass=f.pass.value;
  const bt=f.querySelector("button[type=submit]");bt.disabled=true;
  try{if(!crear){await FA.signInWithEmailAndPassword(fauth,email,pass);return}
   sync.signing=true;const cred=await FA.createUserWithEmailAndPassword(fauth,email,pass);const uid=cred.user.uid;
   try{const bb=FS.writeBatch(fdb);bb.set(FS.doc(fdb,"usuarios",uid),{rol:"prestamista",pid:uid});bb.set(FS.doc(fdb,"prestamistas",uid),{ownerUid:uid,cfg:cfgDefault(f.negocio.value.trim()),creado:Date.now()});await bb.commit()}
   catch(x){try{await FA.deleteUser(cred.user)}catch(y){}sync.signing=false;throw x}
   sync.signing=false;await entrar(cred.user,{rol:"prestamista",pid:uid})}
  catch(x){sync.signing=false;err(msgErr(x))}finally{bt.disabled=false}return}
 if(f.id==="fcreg"){const k=ui.pubCfg||db.cfg;const err=m=>{$("#nerr").textContent=m};
  const nombre=f.nombre.value.trim(),doc=f.doc.value.trim(),tel=f.tel.value.trim(),dir=f.dir.value.trim(),email=f.email.value.trim(),pass=f.pass.value;const monto=num(f.monto.value),plazo=Math.round(num(f.plazo.value)),un=f.unidad.value;
  if(!(monto>=k.montoMin&&monto<=k.montoMax)){err(`El valor debe estar entre ${money(k.montoMin)} y ${money(k.montoMax)}.`);return}
  if(!(plazo>=1&&plazo<=(un==="M"?k.plazoMax:k.plazoMax*2))){err(`El plazo máximo es ${k.plazoMax} meses.`);return}
  if(tel.replace(/\D/g,"").length<7){err("Revisa el teléfono.");return}
  if(pass.length<6){err("La contraseña debe tener mínimo 6 caracteres.");return}
  const bt=f.querySelector("button[type=submit]");bt.disabled=true;
  try{sync.signing=true;const cred=await FA.createUserWithEmailAndPassword(fauth,email,pass);const uid=cred.user.uid,pid=ui.pid;
   const now=Date.now();const c={id:uid,t:now,nombre,doc,tel,dir,email,ref:"",notas:"",estado:"prospecto",origen:"app"};
   const so={id:uid2(),t:now,clienteId:uid,monto,plazo,unidad:un,fecha:today(),etapa:"recibida"};
   const ms={id:uid2(),t:now,clienteId:uid,de:"C",tipo:"solicitud",adj:[],leido:false,txt:`Hola, estoy interesado en un préstamo de ${money(monto)} a ${plazoTxt(plazo,un)}.`};
   try{const bb=FS.writeBatch(fdb);const P=(...p)=>FS.doc(fdb,"prestamistas",pid,...p);bb.set(FS.doc(fdb,"usuarios",uid),{rol:"cliente",pid});bb.set(P("clientes",uid),c);bb.set(P("sols",so.id),so);bb.set(P("msgs",ms.id),ms);await bb.commit()}
   catch(x){try{await FA.deleteUser(cred.user)}catch(y){}throw x}
   sync.signing=false;await entrar(cred.user,{rol:"cliente",pid});ui.tab="c_msg";draw();toast("¡Solicitud enviada! El prestamista te responderá por aquí.")}
  catch(x){sync.signing=false;err(msgErr(x))}finally{bt.disabled=false}}
});
const uid2=uid;
/* ---- arranque ---- */
(async function boot(){
 try{const p=new URLSearchParams(location.search).get("p");if(p)localStorage.setItem("pamava_pid",p);ui.pid=p||localStorage.getItem("pamava_pid")||""}catch(e){ui.pid=""}
 ui.vista="splash";ui.modo="entrar";draw();
 const ok=await (async()=>{try{const base="https://www.gstatic.com/firebasejs/"+FBV+"/";const [a,b,c]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
  FA=b;FS=c;const app=a.initializeApp(FBCFG);fauth=b.getAuth(app);fdb=c.initializeFirestore(app,{experimentalAutoDetectLongPolling:true});return true}catch(e){console.error("Firebase no cargó",e);return false}})();
 if(!ok){ui.fbError=true;ui.vista="inicio";draw();return}
 if(ui.pid){try{const s=await FS.getDoc(FS.doc(fdb,"prestamistas",ui.pid));if(s.exists()&&s.data().cfg){ui.pubCfg=s.data().cfg;ui.pubName=ui.pubCfg.prestamista}else ui.pid=""}catch(e){console.error(e)}}
 FA.onAuthStateChanged(fauth,u=>{if(sync.signing)return;if(u)entrar(u);else if(!ui.demo){salirLocal();ui.vista="inicio";draw()}});
})();

/* ============ inicio ============ */
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
